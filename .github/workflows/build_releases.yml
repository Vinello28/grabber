name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Grabber-Windows.zip
            platform: windows
          - os: macos-latest
            artifact_name: Grabber-macOS.zip
            platform: macos
          - os: ubuntu-latest
            artifact_name: Grabber-Linux.tar.gz
            platform: linux

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Set App Version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          python -c "
          from pathlib import Path
          p = Path('src/core/version.py')
          lines = [f'__version__ = \"$VERSION\"' if l.startswith('__version__ =') else l for l in p.read_text(encoding='utf-8').splitlines()]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          "

      - name: Generate App Icons
        run: |
          python scripts/generate_icons.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          python build_executable.py

      - name: Package Windows Binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Grabber -DestinationPath ${{ matrix.artifact_name }}

      - name: Package macOS Application (.app)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} Grabber.app
          cd ..

      - name: Package Linux Binary
        if: matrix.platform == 'linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C dist Grabber

      - name: Upload Artifact to GitHub Action Run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact_name }}

      - name: Upload Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
