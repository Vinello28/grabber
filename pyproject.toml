[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grabber"
version = "1.0.0"
description = "Big Data Out-of-Core Analytical Query Engine & GUI (70+ GB datasets)"
readme = "README.md"
authors = [{ name = "Grabber Team" }]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "lxml>=5.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
grabber = "run:main"

[tool.pytest.ini_options]
pythonpath = ["."]
