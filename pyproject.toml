[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grabber"
version = "1.2.0"
description = "Big Data Out-of-Core Analytical Query Engine & GUI"
readme = "README.md"
authors = [{ name = "Gabriele Vianello", email = "vianello.tech@gmail.com" }]
license = { text = "Grabber Restrictive Non-Commercial License (RNC-1.0)" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "lxml>=5.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
grabber = "run:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
    "B008", # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"src/ui/app.py" = ["E402"]
